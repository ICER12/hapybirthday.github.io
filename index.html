<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>С Днём Рождения!</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Конфетти (canvas) -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Основной контент -->
    <div class="container">
        <div class="frame">
            <h1 class="birthday-title">HAPPY BIRTHDAY</h1>
            <p class="subtext">С ДНЁМ РОЖДЕНИЯ ПАПА!</p>
            <p class="message">
                Алексей, желаю чтобы всегда получались красивые аквариумы,<br />
                всегда получался очень вкусный плов,<br />
                всегда были интересные сериалы<br />
                и чтобы по меньше людей из за которых пришлось бы говорить: <br />
                "Эээ, вы чоо"
            </p>
        </div>
    </div>

    <!-- Смайлики внизу (двигаются вверх-вниз) -->
    <div class="emojis">
        <span>🎂</span>
        <span>🎈</span>
        <span>🎁</span>
        <span>🥳</span>
        <span>🎉</span>
        <span>🎊</span>
        <span>🐠</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
